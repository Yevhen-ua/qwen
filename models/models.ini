version = 1

[*]
jinja = true
ctx-size = 8192
batch-size = 512
ubatch-size = 512
cache-type-k = q8_0
cache-type-v = q8_0
flash-attn = on
gpu-layers = 999
cache-prompt = true
parallel = 1
threads = 8
threads-batch = 8
temperature = 0.7
top-p = 0.9
top-k = 40
min-p = 0.05
fit = on
fit-target = 1024
fit-ctx = 4096
sleep-idle-seconds = 300

[qwen3-8b-instruct]
model = /models/Qwen3-8B-Instruct/qwen3-8b-instruct-q4_k_m.gguf
ctx-size = 16384
batch-size = 1024
ubatch-size = 512
chat-template = chatml

[qwen3-vl-8b-instruct]
model = /models/Qwen3-VL-8B-Instruct/qwen3-vl-8b-instruct-q4_k_m.gguf
mmproj = /models/Qwen3-VL-8B-Instruct/mmproj-f16.gguf
ctx-size = 4096
batch-size = 256
ubatch-size = 256
image-max-tokens = 1024
chat-template = chatml
