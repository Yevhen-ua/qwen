version = 1

[*]
no-ui = true
threads-http = 2
threads = 12
threads-batch = 12
cache-ram = 16384
parallel = 1
fit = off
flash-attn = on
jinja = true
n-gpu-layers = all
split-mode = layer
tensor-split = 1,1,1,1
no-mmap = true
mlock = true
reasoning = off

[Qwen3.6-27B-Q5]
