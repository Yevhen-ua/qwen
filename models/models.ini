batch-size = 4096
ubatch-size = 1024
cache-type-k = q8_0
cache-type-v  = q8_0

temperature = 0.7
top-p = 0.80
top-k = 20
min-p = 0.0
presence-penalty = 1.5
repeat-penalty = 1.0

